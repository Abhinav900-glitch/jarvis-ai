<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ribbon" x1="150" y1="36" x2="52" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DF3FF" />
      <stop offset="26%" stop-color="#3B9BFF" />
      <stop offset="52%" stop-color="#8B5CF6" />
      <stop offset="76%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#FFB86B" />
    </linearGradient>
    <linearGradient id="ring" x1="30" y1="70" x2="170" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#3B9BFF" />
      <stop offset="100%" stop-color="#7DF3FF" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="42" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.38" />
      <stop offset="58%" stop-color="#7C3AED" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1224" />
      <stop offset="55%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#03050A" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DF3FF" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Tile: deep gradient, a lit top edge, and a faint inner keyline. -->
  <rect width="512" height="512" rx="118" fill="url(#tile)" />
  <rect x="6" y="6" width="500" height="500" rx="113" fill="none" stroke="url(#rim)" stroke-width="2.5" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#9AD8FF" stroke-opacity="0.07" stroke-width="1.5" />

  <!-- The 200-unit mark, scaled into the tile. One geometry, every size. -->
  <g transform="translate(56 56) scale(2)">
    <circle cx="100" cy="92" r="94" fill="url(#bloom)" />

    <!-- Halo under the aperture: light, not a hairline, at 24px. -->
    <path d="M171.3 131.7A78 78 0 1 1 148 38.5" fill="none"
      stroke="url(#ring)" stroke-width="14" stroke-linecap="round" opacity="0.16" />

    <!-- Tilted orbit behind the monogram: depth without closing the shape. -->
    <ellipse cx="100" cy="100" rx="86" ry="24" transform="rotate(-24 100 100)"
      stroke="url(#ring)" stroke-width="1.4" opacity="0.38" />

    <!-- Open aperture: a wide arc with a deliberate gap at the upper right,
         where the spark lives. -->
    <path d="M171.3 131.7A78 78 0 1 1 148 38.5" fill="none"
      stroke="url(#ring)" stroke-width="5.5" stroke-linecap="round" opacity="0.95" />

    <!-- Inner tick ring, dashed so it reads as instrumentation, not a border. -->
    <circle cx="100" cy="100" r="63" fill="none"
      stroke="#8BE0FF" stroke-width="1.2" stroke-linecap="round"
      stroke-dasharray="1.2 9" opacity="0.25" />

    <!-- Monogram J: one confident stroke with a soft hook, leaning a touch. -->
    <path d="M139 42V98C139 135 116 158 88 151C68 146 56 131 53 113"
      fill="none" stroke="url(#ribbon)" stroke-width="44"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.12" />
    <path d="M139 42V98C139 135 116 158 88 151C68 146 56 131 53 113"
      fill="none" stroke="url(#ribbon)" stroke-width="30"
      stroke-linecap="round" stroke-linejoin="round" />

    <!-- Glass highlight down the stem's left edge. -->
    <path d="M130 52V94" fill="none" stroke="url(#gloss)"
      stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Terminal node at the hook, the mark's "live" point. -->
    <circle cx="53" cy="113" r="5.4" fill="#9BF6FF" />
    <circle cx="53" cy="113" r="11" fill="none" stroke="#7DF3FF" stroke-width="1.4" opacity="0.4" />

    <!-- Four-point spark in the aperture gap. -->
    <path d="M174 14C176.2 25.4 180.6 29.8 192 32C180.6 34.2 176.2 38.6 174 50C171.8 38.6 167.4 34.2 156 32C167.4 29.8 171.8 25.4 174 14Z"
      fill="#F8FBFF" />

    <!-- Two quiet satellites so the field feels inhabited at large sizes. -->
    <circle cx="186" cy="86" r="1.8" fill="#BFE9FF" opacity="0.8" />
    <circle cx="34" cy="66" r="1.4" fill="#9BF6FF" opacity="0.5" />
  </g>
</svg>
