<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="j" x1="124" y1="52" x2="70" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAFFFF" />
      <stop offset="30%" stop-color="#7DF3FF" />
      <stop offset="65%" stop-color="#22C8FF" />
      <stop offset="100%" stop-color="#1B8DFF" />
    </linearGradient>
    <linearGradient id="ring" x1="100" y1="8" x2="100" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DF3FF" />
      <stop offset="50%" stop-color="#1B8DFF" />
      <stop offset="100%" stop-color="#7DF3FF" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#35D7FF" stop-opacity="0.16" />
      <stop offset="62%" stop-color="#22C8FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#22C8FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#22C8FF" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#1B8DFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1B8DFF" stop-opacity="0" />
    </radialGradient>

    <!-- Matte obsidian, with only the quietest lift toward the top edge so the
         tile reads as a surface rather than flat black. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="46%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#05080F" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="210" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DF3FF" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#1B8DFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7DF3FF" stop-opacity="0.28" />
    </linearGradient>
  </defs>

  <!-- Squircle tile: matte obsidian, glass sheen, hairline rim. -->
  <rect width="512" height="512" rx="118" fill="url(#tile)" />
  <rect width="512" height="512" rx="118" fill="url(#sheen)" />
  <rect x="7" y="7" width="498" height="498" rx="112" fill="none" stroke="url(#rim)" stroke-width="2.2" />
  <rect x="20" y="20" width="472" height="472" rx="101" fill="none" stroke="#9BF6FF" stroke-opacity="0.05" stroke-width="1.2" />

  <!-- The 200-unit mark, scaled into the tile. -->
  <g transform="translate(56 56) scale(2)">
    <circle cx="100" cy="98" r="96" fill="url(#bloom)" />

    <!-- Outer HUD ring: four equal segments. -->
    <circle cx="100" cy="100" r="86" fill="none" stroke="url(#ring)" stroke-width="3"
      stroke-linecap="round" stroke-dasharray="96 39" opacity="0.85" />

    <!-- Inner tick ring. -->
    <circle cx="100" cy="100" r="74" fill="none" stroke="#7DF3FF" stroke-width="1.2"
      stroke-linecap="round" stroke-dasharray="3 10" opacity="0.22" />

    <!-- Four cardinal nodes. -->
    <circle cx="100" cy="14" r="2" fill="#9BF6FF" opacity="0.85" />
    <circle cx="186" cy="100" r="2" fill="#9BF6FF" opacity="0.85" />
    <circle cx="100" cy="186" r="2" fill="#9BF6FF" opacity="0.85" />
    <circle cx="14" cy="100" r="2" fill="#9BF6FF" opacity="0.85" />

    <!-- Dark hexagonal core, plus a quieter inner face. -->
    <polygon points="100,40 152,70 152,130 100,160 48,130 48,70" fill="url(#core)"
      stroke="#7DF3FF" stroke-width="1.4" opacity="0.9" />
    <polygon points="100,54 139.8,77 139.8,123 100,146 60.2,123 60.2,77"
      fill="none" stroke="#7DF3FF" stroke-width="0.8" opacity="0.16" />

    <!-- Voice waves flanking the monogram. -->
    <path d="M58 88C64 78 72 73 82 74" fill="none" stroke="#7DF3FF" stroke-width="2.2"
      stroke-linecap="round" opacity="0.5" />
    <path d="M49 97C57 80 70 72 86 74" fill="none" stroke="#7DF3FF" stroke-width="1.4"
      stroke-linecap="round" opacity="0.26" />
    <path d="M142 88C136 78 128 73 118 74" fill="none" stroke="#7DF3FF" stroke-width="2.2"
      stroke-linecap="round" opacity="0.5" />
    <path d="M151 97C143 80 130 72 114 74" fill="none" stroke="#7DF3FF" stroke-width="1.4"
      stroke-linecap="round" opacity="0.26" />

    <!-- Ribbon J, with an offset echo behind it. -->
    <path d="M128 52V96C128 123 113 140 94 137C81 135 73 126 70 114" fill="none"
      transform="translate(3.5 4.5)" stroke="#1B8DFF" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.22" />
    <path d="M128 52V96C128 123 113 140 94 137C81 135 73 126 70 114" fill="none"
      stroke="url(#j)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M122 62V92" fill="none" stroke="#EAFFFF" stroke-width="3"
      stroke-linecap="round" opacity="0.45" />

    <!-- Live node at the hook. -->
    <circle cx="70" cy="114" r="3.6" fill="#EAFFFF" />
    <circle cx="70" cy="114" r="7.5" fill="none" stroke="#7DF3FF" stroke-width="1.2" opacity="0.5" />
  </g>
</svg>
